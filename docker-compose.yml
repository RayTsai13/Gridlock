services:
  frontend:
    image: yourdockerhubuser/seattle-transit-sim-frontend:latest
    build:
      context: .
      dockerfile: frontend.Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  backend:
    image: yourdockerhubuser/seattle-transit-sim-backend:latest
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
